<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkHub & QR Manager</title>

  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #1e1b4b 100%);
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --cyan: #06b6d4;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    /* Main Container - Full Width & Height Fill */
    .app-wrapper {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
    }

    .brand h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Stats Chips */
    .stats-bar {
      display: flex;
      gap: 10px;
    }

    .stat-chip {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .stat-chip strong {
      color: var(--cyan);
    }

    /* Grid - Desktop Flexible Dashboard */
    .main-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      flex: 1;
    }

    @media (max-width: 850px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Glass Panels */
    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Input Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(11, 15, 25, 0.7);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Search & Filter Bar */
    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    /* Dynamic Bookmark Cards Container */
    .bookmark-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      max-height: calc(100vh - 230px);
      overflow-y: auto;
      padding-right: 6px;
    }

    @media (max-width: 850px) {
      .bookmark-list {
        max-height: 400px;
      }
    }

    .bookmark-list::-webkit-scrollbar {
      width: 5px;
    }
    .bookmark-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
    }

    .bm-card {
      background: rgba(11, 15, 25, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .bm-card:hover {
      transform: translateY(-2px);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .bm-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .bm-url {
      font-size: 12px;
      color: var(--cyan);
      text-decoration: none;
      display: inline-block;
      max-width: 380px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 1100px) {
      .bm-url { max-width: 200px; }
    }

    .tag-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Dynamic Tag Colors */
    .tag-coding { background: rgba(99, 102, 241, 0.2); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }
    .tag-college { background: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }
    .tag-travel { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .tag-general { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }

    .action-group {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .icon-btn.delete:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #f87171;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      width: 90%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    #qrcode {
      background: white;
      padding: 12px;
      border-radius: 12px;
      display: inline-block;
      margin: 16px 0;
    }

    /* Footer Branding */
    .app-footer {
      text-align: center;
      padding-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .app-footer span {
      color: var(--cyan);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    
    <!-- Top Header Bar -->
    <div class="app-header">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div>
          <h1>LinkHub & QR</h1>
          <p>Smart Bookmark & Instant QR Generator</p>
        </div>
      </div>

      <div class="stats-bar">
        <div class="stat-chip">Saved Links: <strong id="total-count">0</strong></div>
      </div>
    </div>

    <!-- Main Grid Dashboard -->
    <div class="main-grid">
      
      <!-- Left Panel: Add Form -->
      <div class="panel">
        <div class="panel-title">➕ Add New Bookmark</div>
        
        <div class="form-group">
          <input type="text" id="bm-title" class="input-field" placeholder="Title (e.g. Google Form / GitHub)">
          <input type="url" id="bm-url" class="input-field" placeholder="URL (e.g. forms.gle/... or example.com)">
          
          <select id="bm-category" class="input-field">
            <option value="General">General</option>
            <option value="Coding">Coding</option>
            <option value="College">College</option>
            <option value="Travel">Travel</option>
          </select>

          <button class="btn-primary" onclick="addBookmark()">Save Link</button>
        </div>
      </div>

      <!-- Right Panel: Search & Bookmarks Stream -->
      <div class="panel">
        <div class="filter-bar">
          <input type="text" id="search-input" class="input-field" placeholder="🔍 Search bookmarks..." oninput="renderBookmarks()">
          <select id="filter-category" class="input-field" style="width: 160px;" onchange="renderBookmarks()">
            <option value="All">All Categories</option>
            <option value="General">General</option>
            <option value="Coding">Coding</option>
            <option value="College">College</option>
            <option value="Travel">Travel</option>
          </select>
        </div>

        <div class="bookmark-list" id="bookmarks-container">
          <!-- Dynamic Items Rendered Here -->
        </div>
      </div>

    </div>
  </div>

  <!-- Footer Branding -->
  <footer class="app-footer">
    Made with ❤️ by <span>Ankit</span>
  </footer>

  <!-- QR Modal -->
  <div class="modal-overlay" id="qr-modal">
    <div class="modal-card">
      <h3 id="modal-title" style="font-size: 15px; word-break: break-all;">QR Code</h3>
      <div id="qrcode"></div>
      
      <div class="form-group">
        <button class="btn-primary" onclick="downloadQR()">📥 Download PNG</button>
        <button class="input-field" style="cursor: pointer; background: transparent;" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    let bookmarks = [];

    window.onload = function() {
      const saved = localStorage.getItem('hub_bookmarks_v2');
      if (saved) bookmarks = JSON.parse(saved);
      renderBookmarks();
    };

    function addBookmark() {
      const title = document.getElementById('bm-title').value.trim();
      let url = document.getElementById('bm-url').value.trim();
      const category = document.getElementById('bm-category').value;

      if (!title || !url) {
        alert('Please fill both Title and URL!');
        return;
      }

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      bookmarks.push({ id: Date.now(), title, url, category });
      saveAndRender();

      document.getElementById('bm-title').value = '';
      document.getElementById('bm-url').value = '';
    }

    function deleteBookmark(id) {
      bookmarks = bookmarks.filter(b => b.id !== id);
      saveAndRender();
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url);
      alert('Link copied to clipboard!');
    }

    function saveAndRender() {
      localStorage.setItem('hub_bookmarks_v2', JSON.stringify(bookmarks));
      renderBookmarks();
    }

    function renderBookmarks() {
      const container = document.getElementById('bookmarks-container');
      const search = document.getElementById('search-input').value.toLowerCase();
      const filter = document.getElementById('filter-category').value;

      document.getElementById('total-count').innerText = bookmarks.length;

      container.innerHTML = '';

      const filtered = bookmarks.filter(b => {
        const matchesSearch = b.title.toLowerCase().includes(search) || b.url.toLowerCase().includes(search);
        const matchesCat = filter === 'All' || b.category === filter;
        return matchesSearch && matchesCat;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 40px 0; font-size: 13px;">No bookmarks found.</p>';
        return;
      }

      filtered.reverse().forEach(b => {
        const card = document.createElement('div');
        card.className = 'bm-card';
        
        const catClass = 'tag-' + b.category.toLowerCase();

        card.innerHTML = `
          <div>
            <div class="bm-title">${b.title}</div>
            <a href="${b.url}" target="_blank" class="bm-url">${b.url}</a><br>
            <span class="tag-badge ${catClass}">${b.category}</span>
          </div>
          <div class="action-group">
            <button class="icon-btn" onclick="copyLink('${b.url}')" title="Copy Link">📋</button>
            <button class="icon-btn" onclick="showQR('${b.title}', '${b.url}')" title="Generate QR">📱</button>
            <button class="icon-btn delete" onclick="deleteBookmark(${b.id})" title="Delete">✕</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- QR Modal Logic ---
    let qrContainer = document.getElementById('qrcode');

    function showQR(title, url) {
      document.getElementById('modal-title').innerText = title;
      qrContainer.innerHTML = '';

      new QRCode(qrContainer, {
        text: url,
        width: 160,
        height: 160,
        colorDark : "#0f172a",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });

      document.getElementById('qr-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('qr-modal').style.display = 'none';
    }

    function downloadQR() {
      const img = qrContainer.querySelector('img');
      if (img && img.src) {
        const link = document.createElement('a');
        link.href = img.src;
        link.download = 'qrcode.png';
        link.click();
      }
    }
  </script>
</body>
</html>
